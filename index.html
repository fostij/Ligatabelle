<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ligatabelle - Hobbyturnier</title>
    <script src="js/data.js" defer></script>
    <script src="js/league.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>
    <header class="header">
        <h1 class="header__title">Ligatabelle</h1>
        <p class="header__subtitle">Hobbyturnier Hannover 2026</p>
    </header>

    <main class="main">
        <section class="standings">
            <h2 class="standings__title">Tabelle</h2>
            <table class="standings__table">
                <thead>
                    <tr>
                        <th>Platz</th>
                        <th>Team</th>
                        <th>Sp.</th>
                        <th>S</th>
                        <th>U</th>
                        <th>N</th>
                        <th>Tore</th>
                        <th>Diff.</th>
                        <th>Pkt.</th>
                    </tr>
                </thead>
                <tbody id="standings-body"></tbody>
            </table>
        </section>
        <section class="matches">
            <h2 class="matches__title">Spiele</h2>
            <ul class="matches__list" id="match-list"></ul>
        </section>
    </main>
    
</body>
</html>
