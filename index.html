<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ligatabelle – Hobbyturnier</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/data.js" defer></script>
  <script src="js/league.js" defer></script>
  <script src="js/ui.js" defer></script>
  <script src="js/toast.js" defer></script>
  <script src="js/app.js" defer></script>
</head>
<body>
  <!-- Icon-Sammlung eingesetzt -->
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-ball" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 8.5l3.3 2.4-1.3 3.9h-4l-1.3-3.9z"/>
      <path d="M12 8.5V3M15.3 10.9l5.2-1.7M14 14.8l3.2 4.4M10 14.8l-3.2 4.4M8.7 10.9l-5.2-1.7"/>
    </symbol>
    <symbol id="icon-plus" viewBox="0 0 24 24">
      <path d="M12 5v14M5 12h14"/>
    </symbol>
    <symbol id="icon-check" viewBox="0 0 24 24">
      <path d="M5 12.5l4.5 4.5L19 7.5"/>
    </symbol>
    <symbol id="icon-alert" viewBox="0 0 24 24">
      <circle cx="12" cy="12" r="9"/>
      <path d="M12 7.5V13M12 16.5v.01"/>
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="M6 6l12 12M18 6L6 18"/>
    </symbol>
    <symbol id="icon-trash" viewBox="0 0 24 24">
      <path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>
    </symbol>
    <symbol id="icon-edit" viewBox="0 0 24 24">
      <path d="M4 20h4L19 9l-4-4L4 16v4zM13.5 6.5l4 4"/>
    </symbol>
  </svg>

  <header class="header">
    <h1 class="header__title">
      <svg class="icon header__icon" aria-hidden="true"><use href="#icon-ball"></use></svg>
      Ligatabelle
    </h1>
    <p class="header__subtitle">Hobbyturnier Hannover 2026</p>
  </header>

  <main class="main">
    <section class="card standings">
      <h2 class="standings__title">Tabelle</h2>
      <table class="standings__table">
        <thead>
          <tr>
            <th>Platz</th>
            <th>Team</th>
            <th>Sp.</th>
            <th>S</th>
            <th>U</th>
            <th>N</th>
            <th>Tore</th>
            <th>Diff.</th>
            <th>Pkt.</th>
          </tr>
        </thead>
        <tbody id="standings-body"></tbody>
      </table>
      <p class="standings__legend">
        <span class="standings__legend-item">
          <span class="standings__badge standings__badge--leader"></span>Tabellenführer
        </span>
        <span class="standings__legend-item">
          <span class="standings__badge standings__badge--last"></span>Schlusslicht
        </span>
      </p>
    </section>

    <section class="card form-section">
      <h2 class="form-section__title">Spiel hinzufügen</h2>

      <form class="match-form" id="match-form" novalidate>
        <div class="match-form__field">
          <label for="match-date">Datum</label>
          <input type="date" id="match-date" name="date">
        </div>

        <div class="match-form__field">
          <label for="match-home">Heim</label>
          <select id="match-home" name="home"></select>
        </div>

        <div class="match-form__field">
          <label for="match-home-goals">Tore</label>
          <input type="number" id="match-home-goals" name="homeGoals" min="0" step="1">
        </div>

        <div class="match-form__field">
          <label for="match-away-goals">Tore</label>
          <input type="number" id="match-away-goals" name="awayGoals" min="0" step="1">
        </div>

        <div class="match-form__field">
          <label for="match-away">Gast</label>
          <select id="match-away" name="away"></select>
        </div>

        <button type="submit" class="match-form__submit">
          <svg class="icon" aria-hidden="true"><use href="#icon-plus"></use></svg>
          Spiel speichern
        </button>

        <ul class="match-form__messages" id="form-messages" aria-live="polite"></ul>
      </form>
    </section>

    <section class="card matches">
      <h2 class="matches__title">Spiele</h2>
      <div class="matches__controls">
        <div class="matches__control">
          <label for="search-text">Suche</label>
          <input type="search" id="search-text" placeholder="Team suchen …">
        </div>

        <div class="matches__control">
          <label for="filter-result">Ergebnis</label>
          <select id="filter-result">
            <option value="all">Alle Ergebnisse</option>
            <option value="home">Heimsieg</option>
            <option value="draw">Unentschieden</option>
            <option value="away">Auswärtssieg</option>
          </select>
        </div>
      </div>

      <p class="matches__count" id="match-count"></p>
      <ul class="matches__list" id="match-list"></ul>
    </section>
  </main>

  <div class="toast-container" id="toast-container" aria-live="polite"></div>
</body>
</html>
