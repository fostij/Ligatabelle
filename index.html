<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ligatabelle - Hobbyturnier</title>
    <script src="js/data.js" defer></script>
    <script src="js/league.js" defer></script>
    <script src="js/ui.js" defer></script>
    <script src="js/app.js" defer></script>
</head>
<body>
    <header class="header">
        <h1 class="header__title">Ligatabelle</h1>
        <p class="header__subtitle">Hobbyturnier Hannover 2026</p>
    </header>

    <main class="main">
        <section class="standings">
            <h2 class="standings__title">Tabelle</h2>
            <table class="standings__table">
                <thead>
                    <tr>
                        <th>Platz</th>
                        <th>Team</th>
                        <th>Sp.</th>
                        <th>S</th>
                        <th>U</th>
                        <th>N</th>
                        <th>Tore</th>
                        <th>Diff.</th>
                        <th>Pkt.</th>
                    </tr>
                </thead>
                <tbody id="standings-body"></tbody>
            </table>
        </section>
        
        <section class="form-section">
            <h2 class="form-section__title">Spiel hinzufügen</h2>
            <form class="match-form" id="match-form" novalidate>
                <div class="match-form__field">
                    <label for="match-date">Datum</label>
                    <input type="date" id="match-date" name="date">
                </div>

                <div class="match-form__field">
                    <label for="match-home">Heim</label>
                    <select id="match-home" name="home"></select>
                </div>

                <div class="match-form__field">
                    <label for="match-home-goals">Tore Heim</label>
                    <input type="number" id="match-home-goals" name="homeGoals" min="0" step="1">
                </div>

                <div class="match-form__field">
                    <label for="match-away-goals">Tore Gast</label>
                    <input type="number" id="match-away-goals" name="awayGoals" min="0" step="1">
                </div>

                <div class="match-form__fields">
                    <label for="match-away"></label>
                    <select name="away" id="match-away"></select>
                </div>

                <button type="submit" class="match-form__submit">Spiel speichern</button>

                <ul class="match-form__messages" id="form-messages" aria-live="polite"></ul>
            </form>
        </section>

        <section class="matches">
            <h2 class="matches__title">Spiele</h2>
            <ul class="matches__list" id="match-list"></ul>
        </section>
    </main>
    
</body>
</html>
